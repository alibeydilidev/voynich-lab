[project]
name = "voynich-lab"
version = "0.18.0"
description = "Voynich el yazması metni için tekrarlanabilir ölçümler: dört sınav ve aday üretim süreçleriyle karşılaştırma"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "scikit-learn", "xgboost"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
